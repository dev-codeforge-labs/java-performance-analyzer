<div class="min-h-screen bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 flex flex-col">
  <nav class="bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-700 px-6 py-3 flex items-center gap-6">
    <span class="font-bold text-lg text-blue-600 dark:text-blue-400">Performance Analyzer</span>
    <a routerLink="/dashboard" routerLinkActive="text-blue-600 font-semibold" class="text-sm text-gray-600 dark:text-gray-400 hover:text-gray-900">{{ i18n.t('nav.dashboard') }}</a>
    <a routerLink="/call-tree" routerLinkActive="text-blue-600 font-semibold" class="text-sm text-gray-600 dark:text-gray-400 hover:text-gray-900">{{ i18n.t('nav.callTree') }}</a>
    <a routerLink="/hotspots" routerLinkActive="text-blue-600 font-semibold" class="text-sm text-gray-600 dark:text-gray-400 hover:text-gray-900">{{ i18n.t('nav.hotspots') }}</a>
    <a routerLink="/timeline" routerLinkActive="text-blue-600 font-semibold" class="text-sm text-gray-600 dark:text-gray-400 hover:text-gray-900">{{ i18n.t('nav.timeline') }}</a>
    <a routerLink="/diff" routerLinkActive="text-blue-600 font-semibold" class="text-sm text-gray-600 dark:text-gray-400 hover:text-gray-900">{{ i18n.t('nav.diff') }}</a>
    <a routerLink="/gc" routerLinkActive="text-blue-600 font-semibold" class="text-sm text-gray-600 dark:text-gray-400 hover:text-gray-900">{{ i18n.t('nav.gc') }}</a>
    <a routerLink="/settings" routerLinkActive="text-blue-600 font-semibold" class="text-sm text-gray-600 dark:text-gray-400 hover:text-gray-900">{{ i18n.t('nav.settings') }}</a>
    <div class="ml-auto flex items-center gap-2">
      <button (click)="toggleTheme()" class="text-xs px-3 py-1.5 rounded border border-gray-300 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-800">
        {{ isDark() ? i18n.t('theme.light') : i18n.t('theme.dark') }}
      </button>
    </div>
  </nav>
  <main class="flex-1 p-6"><router-outlet /></main>
</div>
